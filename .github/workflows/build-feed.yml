name: Build MSN feed

on:
  schedule:
    - cron: "*/15 * * * *"   # každých 15 minut (GitHub může přidat pár minut zpoždění)
  workflow_dispatch: {}       # ruční spuštění z UI

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KINOBOX_FEED_KEY: ${{ secrets.KINOBOX_FEED_KEY }}
        run: python transform.py

      - name: Commit & push if changed
        run: |
          git config user.name "msn-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml vetted.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update MSN feed"
            git push
          fi
